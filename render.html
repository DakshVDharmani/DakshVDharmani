<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 800px; height: 600px; margin: 0; overflow: hidden; background: #0d1117; }
      body { display: grid; place-items: center; }
      #stage { width: 800px; height: 600px; display: grid; grid-template-columns: 42% 58%; align-items: center; }
      #quote { padding: 0 4px 0 46px; color: #f0f2f5; font: 500 25px/1.48 Inter, "Segoe UI", Arial, sans-serif; letter-spacing: .1px; }
      #quote span { display: block; }
      #view { width: 464px; height: 500px; display: block; }
      #error { position: absolute; inset: 0; display: none; padding: 30px; color: white; font: 16px monospace; white-space: pre-wrap; background: #0d1117; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="quote" aria-label="I shouldn't be alive, unless it was for a reason">
        <span>I shouldn't be alive,</span><span>unless it was for a</span><span>reason</span>
      </div>
      <canvas id="view" width="464" height="500"></canvas>
    </main>
    <pre id="error"></pre>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
    <script type="module" src="/scene.js"></script>
  </body>
</html>
